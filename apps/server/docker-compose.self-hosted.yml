name: ofo-self-hosted

services:
  api:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
      target: release
    environment:
      # yt-dlp, ffmpeg, ffprobe and Node paths are preset in the image
      AUDIO_TMP_DIR: /var/cache/ofo/audio-tmp
      AUTH_MODE: ${AUTH_MODE:-none}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      MEDIA_MAX_CONCURRENT_DOWNLOADS: ${MEDIA_MAX_CONCURRENT_DOWNLOADS:-3}
      MEDIA_PREPARE_TIMEOUT_SECONDS: ${MEDIA_PREPARE_TIMEOUT_SECONDS:-300}
    healthcheck:
      # liveness only: /v4/health/ready probes YouTube and must not get the container restarted
      # prettier-ignore
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v4/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      retries: 3
      start_period: 20s
      timeout: 5s
    image: ghcr.io/kt-trez/ofo-server:${OFO_VERSION:-latest}
    init: true
    ports:
      - '${OFO_PORT:-8080}:8080'
    restart: unless-stopped
    volumes:
      # scratch space of the download+convert jobs (partial files are removed after each job)
      - audio-tmp:/var/cache/ofo/audio-tmp

volumes:
  audio-tmp:
